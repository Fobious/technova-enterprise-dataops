version: 2

sources:
  - name: raw
    database: dev
    schema: technova_raw
    description: "Camada de entrada do Redshift contendo os dados de vendas processados pelo AWS Glue e carregados a partir da camada Silver do Data Lake."
    tables:
      - name: vendas_silver_stage
        description: "Tabela de staging no Amazon Redshift Serverless contendo os dados históricos de vendas provenientes da camada Silver em Apache Parquet."
        columns:
          - name: order_id
            description: "Identificador único do pedido."

          - name: user_id
            description: "Identificador do cliente."

          - name: customer_name
            description: "Nome do cliente. Campo sensível para LGPD."

          - name: customer_email
            description: "E-mail do cliente. Campo sensível para LGPD."

          - name: cpf
            description: "CPF do cliente. Campo sensível para LGPD."

          - name: product_id
            description: "Identificador do produto."

          - name: product_name
            description: "Nome do produto vendido."

          - name: category
            description: "Categoria do produto."

          - name: quantity
            description: "Quantidade de itens adquiridos no pedido."

          - name: unit_price
            description: "Preço unitário do produto."

          - name: price_rs
            description: "Valor bruto do item antes da aplicação do desconto."

          - name: discount_pct
            description: "Percentual de desconto aplicado."

          - name: final_price_rs
            description: "Valor final da venda após desconto."

          - name: payment_method
            description: "Método de pagamento utilizado."

          - name: order_status
            description: "Situação do pedido."

          - name: sales_channel
            description: "Canal utilizado para realização da venda."

          - name: purchase_date
            description: "Data da compra."

          - name: city
            description: "Cidade associada à venda."

          - name: state
            description: "UF associada à venda."

          - name: region
            description: "Região geográfica da venda."

          - name: shipping_cost
            description: "Valor do frete associado ao pedido."

          - name: delivery_days
            description: "Quantidade de dias prevista ou realizada para entrega."

          - name: source_file
            description: "Arquivo CSV de origem do registro, mantido para rastreabilidade e linhagem."

          - name: ingestion_timestamp
            description: "Data e hora em que o registro foi processado pelo pipeline."

          - name: dia
            description: "Dia derivado da data da compra durante o processamento no AWS Glue."
